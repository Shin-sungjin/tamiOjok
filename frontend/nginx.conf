server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spring의 ForwardedHeaderFilter(server.forward-headers-strategy=framework)는
        # X-Forwarded-Proto가 있으면 서버 포트를 그 스킴의 기본 포트로 재해석해버려서,
        # 비표준 포트로 접속했을 때 Host 헤더의 포트를 무시함 (동적 CORS Origin
        # 검증이 request.getServerPort() 기준으로 same-origin을 판정하므로 영향받음).
        # 포트를 포함한 원래 Host를 명시적으로 X-Forwarded-Host로 전달해야
        # ForwardedHeaderFilter가 포트까지 정확히 복원함.
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /index.html;
    }
}
